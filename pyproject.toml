[project]
name = "embedding-api"
version = "2.2.0"
description = "OpenAI-compatible self-hosted embedding API with BGE-M3 (dense + sparse + ColBERT)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Pavel Valentov" },
]
keywords = ["embeddings", "bge-m3", "dense", "sparse", "colbert", "openai-compatible"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "gunicorn==26.1.0",
    "uvicorn-worker==0.4.0",
    "pydantic>=2.13.4",
    "FlagEmbedding>=1.4.0",
    "psutil>=7.2.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
